<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAITO SALES NAVI v3</title><style>body{font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;background:#f1f5f9;color:#172554;margin:0;padding:16px;max-width:760px;margin:auto}header,.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #14234510}header{background:#172554;color:white}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 12px}.muted{font-size:13px;color:#64748b}header .muted{color:#cbd5e1}textarea,input,select{box-sizing:border-box;width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:16px}textarea{min-height:105px}button{border:0;border-radius:12px;background:#1d4ed8;color:white;padding:12px 15px;font-size:15px;font-weight:700;margin:5px 4px 5px 0;cursor:pointer}.secondary{background:#e2e8f0;color:#172554}.q{background:#eff6ff;border-left:4px solid #2563eb;padding:13px;border-radius:8px;margin:9px 0;color:#1e3a8a}.small{font-size:13px}.pill{background:#fef3c7;color:#92400e;padding:6px 10px;border-radius:20px;display:inline-block;margin-bottom:10px}#history{white-space:pre-wrap;font-size:14px;line-height:1.7}label{display:block;margin:12px 0 6px;font-weight:bold}</style></head><body><header><h1>👑 KAITO SALES NAVI v3</h1><p class="muted">回答から「まだ聞けていないこと」を探す深掘りナビ｜iPhone対応・オフライン版</p></header><section class="card"><label>現在の質問</label><select id="stage"><option value="0">今回の面談目的</option><option value="1">仕事内容・現状</option><option value="2">仕事のきっかけ</option><option value="3">将来の目標</option><option value="4">困りごと・課題</option><option value="5">必要な情報・人脈</option><option value="6">提案の確認</option><option value="7">次のステップ</option></select><p class="q" id="base"></p><label>相手の回答（要点だけでOK）</label><textarea id="answer" placeholder="例：動画編集で独立して2年。最近は既存のお客様の仕事が減っていて、新規営業もできていない"></textarea><button id="analyze">🔎 回答から深掘りを考える</button><button class="secondary" id="next">次の基本質問へ →</button></section><section class="card"><h2>🎯 今、確認したいこと</h2><div id="reason" class="pill">回答を入力して分析してね</div><div id="questions"></div><p class="muted">※質問は候補。すでに聞けた内容は繰り返さず、相手の反応を優先してね。</p><button class="secondary" id="summarize">📝 要約のたたき台</button><button class="secondary" id="rescue">🆘 会話に困った</button><p id="extra" class="q" style="display:none"></p></section><section class="card"><h2>🗒 商談メモ</h2><button id="keep">この回答を記録</button><button class="secondary" id="copy">メモをコピー</button><button class="secondary" id="export">CSV保存</button><button class="secondary" id="clear">新しい商談</button><div id="history"></div><p class="muted">データはこのブラウザ内のみ。実名・連絡先などの個人情報は入力しないでね。ブラウザのデータ消去で記録が消える場合があります。</p></section><script>
const $=id=>document.getElementById(id);const bases=['今日はどんな情報交換ができたら嬉しいですか？','今はどんなお仕事をされていますか？','そのお仕事を始めたきっかけは何ですか？','今後はどんなことを実現したいですか？','今、一番課題に感じていることは何ですか？','どんな情報やつながりがあれば役立ちそうですか？','お話を聞いて、こちらからご案内できることがあるかもしれません。ご説明してもいいですか？','今日の内容を踏まえて、次はどうするのがよさそうですか？'];
let notes=[];try{notes=JSON.parse(localStorage.getItem('kaito_notes_v3')||'[]')}catch(e){};function save(){try{localStorage.setItem('kaito_notes_v3',JSON.stringify(notes))}catch(e){}}function render(){ $('base').textContent=bases[+$('stage').value];$('history').textContent=notes.map((n,i)=>`${i+1}.【${n.stage}】\n${n.answer}`).join('\n\n')||'まだ記録はありません。'};
const rules=[
{test:/興味ない|必要ない|結構|買わない|やめて|断り/,reason:'お断りの意思を尊重する',qs:['承知しました。今日は情報交換のみで大丈夫ですか？','ほかに確認しておきたいことはありますか？','このあたりで終了しましょうか？']},
{test:/既存.{0,12}(減|少な|離れ)|リピート.{0,8}(減|少な)/,reason:'既存顧客が減った原因を確認',qs:['既存のお客様からの依頼が減り始めたのはいつ頃ですか？','お客様側の事情が変わったのか、まだ理由が分からない状況ですか？','今は既存のお客様にどんなフォローをされていますか？']},
{test:/新規.{0,12}(取れ|増え|来な|難し|少な)|集客.{0,12}(困|難し|できな)/,reason:'新規獲得のどこで詰まっているかを確認',qs:['今はどんな方法で新規のお客様と出会っていますか？','接点を作る段階と、商談から契約する段階では、どちらが難しいですか？','今まで試した方法で、少しでも反応があったものはありますか？']},
{test:/独立|起業|開業/,reason:'独立の状況と次の課題を確認',qs:['独立はすでにされていますか？ それともこれからですか？','独立してみて、想定と一番違ったことは何ですか？','今後、どんな部分を強化したいですか？']},
{test:/副業|収入|代理店|紹介料/,reason:'副業を検討する際の条件を確認',qs:['副業を考えるようになった理由は何ですか？','収入以外に、時間や費用面で重視していることはありますか？','始める前にどんな条件が明確になっていると安心ですか？']},
{test:/経営者|人脈|交流|つながり|紹介/,reason:'求めている出会いの目的を確認',qs:['どんな分野の方とのつながりを求めていますか？','その方とお話しできたら、何を相談したいですか？','すでに交流の機会はありますか？ 足りないのはどんな部分ですか？']},
{test:/転職|退職|職場|会社員/,reason:'働き方の希望を確認',qs:['今の働き方で変えたいことは何ですか？','次の環境で特に重視したい条件は何ですか？','そのために今、何か動かれていますか？']},
{test:/動画編集|制作|デザイン|Web|エンジニア/,reason:'事業の現状を具体化する',qs:['普段はどんなお客様から依頼を受けることが多いですか？','お仕事は紹介と新規営業のどちらが中心ですか？','今後増やしたい仕事はどんな案件ですか？']},
{test:/忙し|時間がない|余裕がない/,reason:'時間的な制約を確認',qs:['特に忙しくなるのはどんな業務ですか？','今は何を最優先にしたいですか？','今日はどこまでお話しするのが負担なく進められそうですか？']}
];
function analyze(){const a=$('answer').value.trim();const box=$('questions');box.replaceChildren();if(!a){$('reason').textContent='まず回答を入力してね';return}const matched=rules.filter(r=>r.test.test(a));const chosen=matched[0];$('reason').textContent=chosen?chosen.reason:'具体的な状況・理由・希望を確認';let q=chosen?chosen.q:['そのお話の中で、一番重要だと感じているのはどこですか？','そう感じるようになったきっかけは何ですか？','今はそのために何か取り組まれていますか？'];if(matched.length>1){q=[...q.slice(0,2),...matched[1].qs.slice(0,1)];}q.forEach((v,i)=>{const d=document.createElement('div');d.className='q';d.textContent=`${i+1}. ${v}`;box.appendChild(d)});$('extra').style.display='none'}
$('analyze').onclick=analyze;$('answer').addEventListener('input',()=>{clearTimeout(window.t);window.t=setTimeout(analyze,350)});$('stage').onchange=render;$('next').onclick=()=>{$('stage').value=Math.min(7,+$('stage').value+1);render();analyze()};$('summarize').onclick=()=>{const a=$('answer').value.trim();$('extra').style.display='block';$('extra').textContent=a?`「${a.slice(0,95)}」という状況なんですね。ここまでの理解で合っていますか？`:'まず回答を入力してね。'};$('rescue').onclick=()=>{$('extra').style.display='block';$('extra').textContent='「少し整理させてください。今のお話で、一番大事なのはどの部分でしょうか？」'};$('keep').onclick=()=>{const a=$('answer').value.trim();if(!a)return alert('回答を入力してね');notes.push({stage:$('stage').selectedOptions[0].text,answer:a});save();render();alert('記録したよ！')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('history').textContent);alert('コピーしたよ')}catch(e){alert('コピーできない場合はメモを長押ししてコピーしてね')}};$('export').onclick=()=>{const csv='段階,回答\n'+notes.map(n=>[n.stage,n.answer].map(x=>'"'+x.replace(/"/g,'""')+'"').join(',')).join('\n');const b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='kaito_sales_notes.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('clear').onclick=()=>{if(!confirm('この商談メモを消して新しく始める？'))return;notes=[];save();$('answer').value='';$('stage').value='0';$('questions').replaceChildren();render()};render();
</script></body></html>
